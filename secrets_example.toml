# The TURN server login for the live video (see README.md, step 2). Choose ONE option.
# On Streamlit Cloud: paste your choice into the app's  Settings -> Secrets  box, with your own values.
# On your own computer you do not need any of this (localhost works without TURN).

# ---- Option A (easiest, free): a Hugging Face access token
# huggingface.co -> sign up -> Settings -> Access Tokens -> Create new token (type "Read") -> copy it here
HF_TOKEN = "hf_YOUR-TOKEN"

# ---- Option B: Cloudflare Realtime TURN (free tier) -- a TURN key ID and its API token
# CLOUDFLARE_TURN_KEY_ID = "YOUR-KEY-ID"
# CLOUDFLARE_TURN_KEY_API_TOKEN = "YOUR-API-TOKEN"

# ---- Option C: any TURN service that gives you URLs, a username and a password (e.g. Metered)
# [turn]
# urls = ["turn:YOUR-TURN-SERVER:80", "turn:YOUR-TURN-SERVER:443", "turns:YOUR-TURN-SERVER:443?transport=tcp"]
# username = "YOUR-TURN-USERNAME"
# credential = "YOUR-TURN-PASSWORD"
