# The TURN server login for the live video (see README.md, step 2). Choose ONE option.
# On Streamlit Cloud: paste your choice into the app's  Settings -> Secrets  box, with your own values.
# NEVER put your real username and password in THIS file: it is committed to GitHub for everyone to see.
# On your own computer you do not need any of this (localhost works without TURN).

# ---- Option A (free, sign up with an email): ExpressTURN -- 1,000 GB a month
# expressturn.com -> sign up -> dashboard "TURN Servers": copy the username and password.
# Free accounts use the server free.expressturn.com. (The app adds a TCP version of the address by itself.)
[turn]
urls = ["turn:free.expressturn.com:3478"]
username = "YOUR-USERNAME"
credential = "YOUR-PASSWORD"

# ---- Option B: Cloudflare's TURN service (1,000 GB a month free, but needs a payment method on the account)
# Cloudflare dashboard -> Realtime -> TURN Server -> Create -> copy the Turn Token ID and API Token
# CLOUDFLARE_TURN_KEY_ID = "YOUR-TURN-KEY-ID"
# CLOUDFLARE_TURN_KEY_API_TOKEN = "YOUR-TURN-KEY-API-TOKEN"
