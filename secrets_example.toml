# The TURN server login for the live video (see README.md, step 2).
# On Streamlit Cloud: copy this text into the app's  Settings -> Secrets  box, with your own values.
# On your own computer you do not need it (localhost works without TURN).
[turn]
urls = ["turn:YOUR-TURN-SERVER:80", "turn:YOUR-TURN-SERVER:443", "turns:YOUR-TURN-SERVER:443?transport=tcp"]
username = "YOUR-TURN-USERNAME"
credential = "YOUR-TURN-PASSWORD"
